plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'org.secuso.privacyfriendly2048'
    defaultConfig {
        applicationId 'org.secuso.privacyfriendly2048.haoke'
        minSdkVersion 21
        targetSdkVersion 34
        compileSdk 34
        versionCode 108
        versionName "1.4.2-haoke.3"
        testInstrumentationRunner "org.secuso.privacyfriendly2048.LanguageProbe"
    }
    signingConfigs {
        formal {
            if (System.getenv('PF2048_KEYSTORE')) {
                storeFile file(System.getenv('PF2048_KEYSTORE'))
                storePassword System.getenv('PF2048_STORE_PASS')
                keyAlias System.getenv('PF2048_KEY_ALIAS')
                keyPassword System.getenv('PF2048_KEY_PASS')
            }
        }
    }
    testBuildType project.hasProperty('formalTest') ? 'release' : 'debug'
    buildTypes {
        debug {
            applicationIdSuffix ".qa"
            versionNameSuffix "-qa.7"
        }
        release {
            signingConfig signingConfigs.formal
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    kotlin {
        jvmToolchain(17)
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def appName = "pfa-2048"
            outputFileName = appName + "-${variant.name}-v${variant.versionName}.apk"
        }
    }

    dataBinding {
        enabled = true
    }
    namespace 'org.secuso.privacyfriendly2048'

    lint {
        lintConfig = file("lint.xml")
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'

    // Backup
    implementation project(path: ':backup-api')
    def work_version = "2.9.1"
    implementation "androidx.work:work-runtime:$work_version"
    implementation "androidx.work:work-runtime-ktx:$work_version"
    androidTestImplementation "androidx.work:work-testing:$work_version"
    implementation 'androidx.sqlite:sqlite-ktx:2.4.0'

    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
